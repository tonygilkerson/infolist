- Name: .Net Install
  Tags: [ ".net"  ]
  Description: Direnv
  Note: |
    # Install
    brew install dotnet@10

    # 1. Create a symlink so your shell can find the dotnet binary
    brew link --overwrite dotnet@10

    # 2. Add the required DOTNET_ROOT environment variable to your shell profile
    SHELL_RC="$HOME/.bashrc"
    [[ "$SHELL" == */zsh ]] && SHELL_RC="$HOME/.zshrc"

    echo 'export DOTNET_ROOT="$(brew --prefix dotnet@10)/libexec"' >> "$SHELL_RC"

    # 3. Reload your profile to apply changes
    source "$SHELL_RC"

    # Verify
    $ dotnet --version

- Name: .Net commands
  Tags: [ ".net"  ]
  Description: Direnv
  Note: |
    # 1. Restore the exact versions of the tools pinned by this codebase
    dotnet tool restore

    # 2. Clear out any broken build artifacts from earlier
    dotnet clean

