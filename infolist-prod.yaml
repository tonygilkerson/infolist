  Note: |
    
    On AG you should install homebrew into you home folder.  To install Homebrew locally into 
    your home directory on Linux, run the official installation script and define a custom 
    installation prefix. 

      # 1. Create the destination folder
      mkdir -p ~/.linuxbrew

      # 2. Download and extract the Homebrew files directly into ~/.linuxbrew 
      # NOTE: I am not 100% sure about this
      curl -L https://github.com/Homebrew/brew/tarball/master | tar xz --strip-components=1 -C ~/.linuxbrew

      # 3. Apply the changes to your current terminal session
      eval "$($HOME/.linuxbrew/bin/brew shellenv)"

      #4 Finalize
      brew update

