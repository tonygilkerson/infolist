- Name: Dagger Mirrors
  Tags: [ "dagger" ]
  Description: Configure Dagger to use Mirrors to avoid rate limit
  Note: |
      How to configure dagger engine to use a mirror to avoid docker pull rate limit

      The following done on AG from a VM in `~/rate-work` directory.

      {
        "logLevel": "trace",
        "registries": {
          "docker.io": {
            "mirrors": ["harbor.act3.analyticsgateway.com/proxy_cache"]
          }
        }
      }

      {
        "logLevel": "trace",
        "registries": {
          "docker.io": {
            "mirrors": ["harbor.act3.analyticsgateway.com/dockerhub"]
          }
        }
      }

      {
        "logLevel": "trace",
        "registries": {
          "docker.io": {
            "mirrors": ["http://192.168.30.204:8080"],
            "rewrite": {
              "^([^/]+)/(.*)$": "dockerhub/$1/$2"
            }
          }
        }
      }

- Name: Dagger Commands
  Tags: [ "dagger" ]
  Description: Some dagger commands
  Note: |
    # Prune
    dagger core engine local-cache prune

    # Cache size
    dagger core engine local-cache entry-set disk-space-bytes

    # Query
      Put your query in a file called query.gql
      {
        engine {
          localCache {
            entrySet {
              entries
            }
          }
        }
      }

      Then run 
      $ dagger query <query.gql

      # Or like this
      DAGGER_NO_NAG=1 dagger query <<EOF | grep -B 6 -A 1 cachemount | less
      {
        engine {
          localCache {
            entrySet {
              entries
            }
          }
        }
      }
      EOF

      DAGGER_NO_NAG=1 dagger query <<EOF | grep -B 3 -A 4 "uv sync" | less
      {
        engine {
          localCache {
            entrySet {
              entries
            }
          }
        }
      }
      EOF

