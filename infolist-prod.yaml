- Name: Brew Install Home Dir
  Tags: [ "brew"  ]
  Description: How to install homebrew in our home directory
  Note: |

    # 1. Move to your home directory and make the folder
    cd ~
    mkdir .linuxbrew

    # 2. Download and extract the official Homebrew core tarball directly into it
    curl -L https://github.com/Homebrew/brew/tarball/master | tar xz --strip-components 1 -C .linuxbrew

    # Determine your active shell config file (handles bash or zsh automatically)
    SHELL_RC="$HOME/.bashrc"
    [[ "$SHELL" == */zsh ]] && SHELL_RC="$HOME/.zshrc"

    # Append the Homebrew environment initialization to your profile
    echo '# Homebrew Custom Home Folder Installation' >> "$SHELL_RC"
    echo 'eval "$($HOME/.linuxbrew/bin/brew shellenv)"' >> "$SHELL_RC"

    # Reload your shell profile right now to apply the changes instantly
    source "$SHELL_RC"

    # Verify
    brew doctor

    # Might need to do this
    sudo apt-get update
    sudo apt install bubblewrap

