- Name: Get DoD Certs
  Tags: [ "certs", "dod" ]
  Description: zip files containing all the CA for PKI
  Note: |
    # DoD Certs

    ################### NOTE ##################################
      See: ~/gitlab-dle/anthony.gilkerson/notebook/topics/DoD Certs/README.md
      The stuff below is old, here for reference
    ################### NOTE ##################################
    
    ## DoC Cert Install Script

    * see: https://gitlab.com/act3-ai/asce/up/-/tree/main/dod-certs

    ## Dagger
    
    Dagger requires certs in a top-level directory.
    Place a copy of your DoD certs in ~/.config/dagger/ca-certificates:

    ```
    cp /usr/local/share/ca-certificates/DoD/DoD* ~/.config/dagger/ca-certificates    
    ```

    ## Update the System Trust Store

    Run the following command to tell Ubuntu to scan that directory and add your DoD certificates to the system-wide bundle:

    ```
    # Copy the certificate to the system trust directory (must have a .crt extension)
    sudo cp ~/.config/dagger/ca-certificates/dod.crt /usr/local/share/ca-certificates/dod.crt

    # Split the multi-cert file into individual certificate files
    cd /usr/local/share/ca-certificates/dod.crt
    awk '/-----BEGIN CERTIFICATE-----/{flag=1; c++} flag{print > sprintf("dod_ca_%02d.crt", c)} /-----END CERTIFICATE-----/{flag=0}' dod.crt

    # Verify the split files look good, remove the all in one file
    cat dod_ca_01.crt # for each 01 to 04
    rm dod.crt

    # Update the system CA store
    sudo update-ca-certificates --fresh

    # Verify
    openssl s_client -connect mattermost.dle.afrl.af.mil:443 -CApath /etc/ssl/certs
    ```

    What this does:
    It scans /usr/local/share/ca-certificates/.
    It creates symbolic links in /etc/ssl/certs/.
    It appends the certificates to the single ca-certificates.crt file used by most Linux applications (including curl, git, and Python).

    ## Update the Chrome/NSS Database
    
    You need to do this so chrome trusts the DoD certs across all profiles.

    In stall if needed:
    
    ```
    sudo apt install libnss3-tools
    ```

    Then run this command to add the DoD certs to the NSS database used by Chrome:

    ```
    for cert in /usr/local/share/ca-certificates/DoD/*.crt; do
        certname=$(basename "$cert" .crt)
        certutil -d sql:$HOME/.pki/nssdb -A -t "CT,C,C" -n "$certname" -i "$cert"
    done    
    ```

    Verify, You should see a list of your DoD CA certificates with the trust attributes CT,C,C.

    ```
    certutil -d sql:$HOME/.pki/nssdb -L
    ```

