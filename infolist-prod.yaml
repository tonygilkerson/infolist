- Name: Code Review Instructions, ACS
  Tags: [ "review" ]
  Description: General instructions for ACS code reviews
  Note: |
    # Code Review Instructions, ACS

    ## As a Dev

      * When the dev working the task feels like the task is complete, the issue gets moved into 
        review status and MRs are created (if they weren't already) 

      * Those MRs are added to the issue to make it easier for the reviewer to review the changes

      * In cases where the issue involves ci-templates or other repos that we do not maintain, it's
        preferable not to involve Corey or others from his team until the reviewer from our team has
        completed the review.

    ## As a Reviewer
    
    ### General instructions

      * Discuss with the dev as needed to accomplish each step
      * If the review uncovers any corrections that should be made, communicate these to the dev so
        they can be addressed
        * In some cases this may include improvements rather than corrections.  
        * Document any changes or corrections as needed.
      * Repeat the steps when the dev is done with corrections until the issue is ready to be merged
    
    ### Specific Tasks

      * understand the problem
      * understand the goals of the solution
      * review the code
        * determine if the code addresses the problem and the solution goals
        * where applicable check for best practices (we don't have any established/documented coding
          standards/guidelines for devops work)
        * is the code (specifically what has been changed) readable?
      * verify the changes solves the problem and achieves the goals through manual/automated testing
      * verify documentation
        * do last, this gives us the option to delay documentation if necessary and prevents 
          documentation churn as a consequence of review feedback
      * Before merging to main check the DoD teams channel used to synchronize merges, if someone
        else is doing a merge then you will need to wait.


